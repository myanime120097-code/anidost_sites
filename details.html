<script>
(function () {
  'use strict';

  var WORKER_URL = 'https://anidost-drive.animedost.workers.dev';
  var CACHE_KEY = 'aniDostAnimeCache_v1';
  var CACHE_META_KEY = 'aniDostAnimeCacheMeta_v1';

  var path = window.location.pathname.toLowerCase();
  var isHome    = path === '/' || path === '' || /index\.html$/.test(path);
  var isAnime   = /anime\.html$/.test(path) || /^\/anime\/?$/.test(path) || /\/anime\.html$/.test(path);
  var isDetails = /details\.html$/.test(path) || /^\/details\/?$/.test(path) || /\/details\.html$/.test(path);

  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return null;
      if (arr.length === 0) return null;
      return arr;
    } catch (e) { return null; }
  }

  function writeCache(data) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      localStorage.setItem(CACHE_META_KEY, JSON.stringify({
        savedAt: Date.now(),
        count: data.length
      }));
    } catch (e) {}
  }

  function clearCache() {
    try {
      localStorage.removeItem(CACHE_KEY);
      localStorage.removeItem(CACHE_META_KEY);
    } catch (e) {}
  }

  function getCacheMeta() {
    try {
      var raw = localStorage.getItem(CACHE_META_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }

  async function fetchFromWorker() {
    var listRes = await fetch(WORKER_URL + '/list-public');
    if (!listRes.ok) throw new Error('List fetch failed: HTTP ' + listRes.status);

    var listData = await listRes.json();
    var files = (listData && listData.files) || [];
    if (!files.length) return [];

    for (var i = 0; i < files.length; i++) {
      var src = WORKER_URL + '/js/' + files[i].name;
      try { await loadScript(src); } catch (e) {}
    }

    var all = [];
    Object.keys(window).forEach(function (k) {
      if (/^ANIME_BATCH_\d+$/.test(k) && Array.isArray(window[k])) {
        all = all.concat(window[k]);
      }
    });

    Object.keys(window).forEach(function (k) {
      if (/^ANIME_BATCH_\d+$/.test(k)) {
        try { delete window[k]; } catch (e) { window[k] = undefined; }
      }
    });

    return all;
  }

  async function loadAnime(forceRefresh) {
    if (!forceRefresh) {
      var cached = readCache();
      if (cached && cached.length > 0) return cached;
    }
    var data = await fetchFromWorker();
    if (data.length > 0) writeCache(data);
    return data;
  }

  function dispatch(list) {
    if (isHome && typeof window.renderHome === 'function') {
      window.renderHome(list);
      return true;
    }
    if (isAnime && typeof window.renderAnimePage === 'function') {
      window.renderAnimePage(list);
      return true;
    }
    if (isDetails && typeof window.renderDetailPage === 'function') {
      window.renderDetailPage(list);
      return true;
    }
    return false;
  }

  function hideLoading() {
    var s = document.getElementById('loadingScreen');
    if (s) {
      s.classList.add('fade');
      setTimeout(function () { s.hidden = true; }, 550);
    }
  }

  async function boot() {
    try {
      var forceRefresh = window.location.search.indexOf('refresh=1') !== -1;
      if (forceRefresh) clearCache();

      var list = await loadAnime(forceRefresh);

      if (!list || list.length === 0) {
        var handled = dispatch([]);
        if (!handled) hideLoading();
        return;
      }

      var handled = dispatch(list);
      if (!handled) hideLoading();
    } catch (e) {
      hideLoading();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  window.AniDostLoader = {
    getCached: function () { return readCache() || []; },
    meta: function () { return getCacheMeta(); },
    refresh: async function () { clearCache(); return await loadAnime(true); },
    clear: clearCache,
    cacheSize: function () {
      try { return (localStorage.getItem(CACHE_KEY) || '').length; }
      catch (e) { return 0; }
    }
  };
})();
</script>
