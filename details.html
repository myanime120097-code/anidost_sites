<script>
/* ============================================================
   loader.js — Persistent loader with localStorage cache
============================================================ */
(function () {
  'use strict';

  var WORKER_URL = 'https://anidost-drive.animedost.workers.dev';
  var CACHE_KEY = 'aniDostAnimeCache_v1';
  var CACHE_META_KEY = 'aniDostAnimeCacheMeta_v1';

  var path = window.location.pathname.toLowerCase();
  var isHome    = /(^|\/)index\.html$/.test(path) || path === '/' || path.endsWith('/');
  var isAnime   = /anime\.html$/.test(path);
  var isDetails = /details\.html$/.test(path);

  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return null;
      if (arr.length === 0) return null;
      return arr;
    } catch (e) {
      console.warn('[loader] Cache read error:', e.message);
      return null;
    }
  }

  function writeCache(data) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      localStorage.setItem(CACHE_META_KEY, JSON.stringify({
        savedAt: Date.now(),
        count: data.length
      }));
      console.log('[loader] Cached', data.length, 'anime to localStorage');
    } catch (e) {
      console.warn('[loader] Cache write error (quota?):', e.message);
    }
  }

  function clearCache() {
    try {
      localStorage.removeItem(CACHE_KEY);
      localStorage.removeItem(CACHE_META_KEY);
      console.log('[loader] Cache cleared');
    } catch (e) {}
  }

  function getCacheMeta() {
    try {
      var raw = localStorage.getItem(CACHE_META_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }

  async function fetchFromWorker() {
    console.log('[loader] Fetching from Worker:', WORKER_URL);

    var listRes = await fetch(WORKER_URL + '/list-public');
    if (!listRes.ok) throw new Error('List fetch failed: HTTP ' + listRes.status);

    var listData = await listRes.json();
    var files = (listData && listData.files) || [];

    if (!files.length) {
      console.log('[loader] KV empty — no anime');
      return [];
    }

    console.log('[loader] Found', files.length, 'batch files');

    for (var i = 0; i < files.length; i++) {
      var src = WORKER_URL + '/js/' + files[i].name;
      try {
        await loadScript(src);
        console.log('[loader] Loaded', files[i].name);
      } catch (e) {
        console.warn('[loader] Batch failed:', files[i].name, e.message);
      }
    }

    var all = [];
    Object.keys(window).forEach(function (k) {
      if (/^ANIME_BATCH_\d+$/.test(k) && Array.isArray(window[k])) {
        all = all.concat(window[k]);
      }
    });

    Object.keys(window).forEach(function (k) {
      if (/^ANIME_BATCH_\d+$/.test(k)) {
        try { delete window[k]; } catch (e) { window[k] = undefined; }
      }
    });

    console.log('[loader] Collected', all.length, 'anime from Worker');
    return all;
  }

  async function loadAnime(forceRefresh) {
    if (!forceRefresh) {
      var cached = readCache();
      if (cached && cached.length > 0) {
        var meta = getCacheMeta();
        console.log('[loader] ✅ Using LOCAL cache —', cached.length, 'anime',
                    meta ? '(saved ' + new Date(meta.savedAt).toLocaleString() + ')' : '');
        return cached;
      }
    }

    console.log('[loader] No cache — fetching from Worker...');
    var data = await fetchFromWorker();

    if (data.length > 0) {
      writeCache(data);
    }

    return data;
  }

  function dispatch(list) {
    if (isHome && typeof window.renderHome === 'function') {
      window.renderHome(list);
      return true;
    }
    if (isAnime && typeof window.renderAnimePage === 'function') {
      window.renderAnimePage(list);
      return true;
    }
    if (isDetails && typeof window.renderDetailPage === 'function') {
      window.renderDetailPage(list);
      return true;
    }
    return false;
  }

  function hideLoading() {
    var s = document.getElementById('loadingScreen');
    if (s) {
      s.classList.add('fade');
      setTimeout(function () { s.hidden = true; }, 550);
    }
  }

  function showError(msg) {
    hideLoading();

    var errEl = document.getElementById('loadError');
    if (errEl) {
      errEl.style.display = 'block';
      errEl.textContent = '⚠️ ' + msg;
      return;
    }

    var banner = document.createElement('div');
    banner.style.cssText =
      'position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;' +
      'padding:12px 16px;text-align:center;font-size:14px;z-index:99999;' +
      'font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,0.3);';
    banner.textContent = '⚠️ ' + msg;
    document.body.appendChild(banner);
  }

  async function boot() {
    try {
      var forceRefresh = window.location.search.indexOf('refresh=1') !== -1;
      if (forceRefresh) {
        console.log('[loader] Force refresh requested via URL');
        clearCache();
      }

      var list = await loadAnime(forceRefresh);

      if (!list || list.length === 0) {
        console.log('[loader] No anime data');
        var handled = dispatch([]);
        if (!handled) hideLoading();
        return;
      }

      var handled = dispatch(list);
      if (!handled) {
        console.warn('[loader] No render function found for this page');
        hideLoading();
      }
    } catch (e) {
      console.error('[loader] Fatal error:', e);
      showError('Failed to load anime data. Tap to retry.');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  window.AniDostLoader = {
    getCached: function () { return readCache() || []; },
    meta: function () { return getCacheMeta(); },
    refresh: async function () {
      clearCache();
      var data = await loadAnime(true);
      return data;
    },
    clear: clearCache,
    cacheSize: function () {
      try {
        var raw = localStorage.getItem(CACHE_KEY) || '';
        return raw.length;
      } catch (e) { return 0; }
    }
  };

  console.log('[loader] Ready. Use AniDostLoader for manual control.');
})();
</script>
